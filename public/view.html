<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>家人的记忆</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fdf6ee;
    color: #333;
    font-size: 18px;
    min-height: 100vh;
    padding: 16px;
    padding-bottom: 200px;
  }
  .container { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 24px; text-align: center; margin: 12px 0; color: #5a3825; font-weight: 600; }
  h2 { font-size: 20px; margin: 24px 0 12px; color: #5a3825; font-weight: 600; }

  video {
    width: 100%;
    border-radius: 16px;
    background: black;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  }

  .meta-box {
    background: white;
    border-radius: 16px;
    padding: 16px;
    margin: 16px 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .meta-style {
    display: inline-block;
    background: #fef3ec;
    color: #e76f51;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 14px;
    margin-bottom: 8px;
  }
  .meta-text {
    font-size: 18px;
    line-height: 1.7;
    color: #555;
  }

  .comment-item {
    background: white;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .comment-head {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    font-size: 14px;
    color: #999;
  }
  .comment-author { color: #e76f51; font-weight: 600; }
  .comment-text { font-size: 17px; line-height: 1.6; color: #444; }
  .comment-audio {
    margin-top: 8px;
    width: 100%;
  }

  /* 评论输入区 */
  .comment-input-area {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    box-shadow: 0 -2px 16px rgba(0,0,0,0.1);
    padding: 16px;
    z-index: 100;
  }
  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    max-width: 560px;
    margin: 0 auto;
  }
  textarea {
    flex: 1;
    border: 2px solid #f4a261;
    border-radius: 12px;
    padding: 12px;
    font-size: 17px;
    font-family: inherit;
    resize: none;
    min-height: 44px;
    max-height: 120px;
    outline: none;
    color: #333;
  }
  textarea:focus { border-color: #e76f51; }

  .btn {
    min-height: 48px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    padding: 0 16px;
    white-space: nowrap;
  }
  .btn-primary { background: #e76f51; color: white; }
  .btn-primary:active { transform: scale(0.97); }
  .btn-voice {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #f4a261;
    color: white;
    min-width: 56px;
    padding: 0 12px;
  }
  .btn-voice.recording {
    background: #d62828;
  }
  .btn-voice .voice-icon { font-size: 22px; }
  .btn-voice .voice-label { font-size: 12px; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #999;
    font-size: 18px;
  }
  .loading {
    text-align: center;
    padding: 60px;
    color: #888;
  }

  .author-name-input {
    border: none;
    border-bottom: 2px solid #eee;
    font-size: 16px;
    padding: 4px 0;
    width: 120px;
    outline: none;
    color: #e76f51;
    font-weight: 600;
  }
  .author-name-input:focus { border-color: #e76f51; }
</style>
</head>
<body>
<div class="container">
  <h1>💝 家人的记忆留言</h1>

  <div id="loadingBox" class="loading">正在加载…</div>

  <div id="contentBox" style="display:none;">
    <video id="videoPlayer" controls=""></video>

    <div class="meta-box">
      <span class="meta-style" id="styleTag"></span>
      <div class="meta-text" id="textContent"></div>
    </div>

    <h2>💬 家人留言 (<span id="commentCount">0</span>)</h2>
    <div id="commentList"></div>
  </div>

  <div class="comment-input-area">
    <div class="input-row">
      <textarea id="textInput" placeholder="说点什么送给爸爸妈妈…" rows="1"></textarea>
      <button class="btn btn-primary" onclick="sendText()">发送</button>
      <button id="voiceBtn" class="btn btn-voice" onmousedown="startVoice()" onmouseup="stopVoice()" onmouseleave="stopVoice()" ontouchstart="event.preventDefault();startVoice()" ontouchend="event.preventDefault();stopVoice()">
        <span class="voice-icon">🎙️</span>
        <span class="voice-label" id="voiceLabel">按住说</span>
      </button>
    </div>
  </div>
</div>

<script>
  // ============ 状态 ============
  const params = new URLSearchParams(window.location.search);
  const memoryId = params.get('memory_id');
  let audioBlob = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;

  // ============ 加载记忆 ============
  async function loadMemory() {
    if (!memoryId) {
      document.getElementById('loadingBox').innerHTML = '❌ 缺少 memory_id';
      return;
    }

    // demo 模式：显示一个示例
    if (memoryId === 'demo') {
      showDemo();
      return;
    }

    try {
      const resp = await fetch(`/api/memory/${memoryId}`);
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || '加载失败');
      renderMemory(data);
    } catch (err) {
      document.getElementById('loadingBox').innerHTML = '❌ ' + err.message;
    }
  }

  function showDemo() {
    const data = {
      memory: {
        id: 'demo',
        text: '今天天气真好，我在院子里拍了一张照片，这是我最喜欢的地方。',
        style: '怀旧',
        video_url: 'https://www.w3schools.com/html/mov_bbb.mp4',
        status: 'succeeded',
        created_at: Date.now(),
      },
      comments: [
        { author: '小明', text: '爸爸妈妈，看到这个视频好想你们！', created_at: Date.now() - 3600000 },
        { author: '小芳', text: '下次放假我们回家看你们！', created_at: Date.now() - 1800000 },
      ],
    };
    renderMemory(data);
  }

  function renderMemory(data) {
    document.getElementById('loadingBox').style.display = 'none';
    document.getElementById('contentBox').style.display = 'block';

    const video = document.getElementById('videoPlayer');
    if (data.memory.video_url && data.memory.status === 'succeeded') {
      video.src = data.memory.video_url;
    } else {
      video.replaceWith(Object.assign(document.createElement('div'), {
        style: 'background:#eee;height:240px;display:flex;align-items:center;justify-content:center;border-radius:16px;color:#999;',
        textContent: '视频正在生成中或生成失败…'
      }));
    }

    document.getElementById('styleTag').textContent = data.memory.style || '';
    document.getElementById('textContent').textContent = data.memory.text || '';

    renderComments(data.comments || []);
  }

  function renderComments(comments) {
    document.getElementById('commentCount').textContent = comments.length;
    const list = document.getElementById('commentList');
    if (comments.length === 0) {
      list.innerHTML = '<div class="empty-state">还没有留言，快来留第一条吧 💌</div>';
      return;
    }
    list.innerHTML = comments.map(c => `
      <div class="comment-item">
        <div class="comment-head">
          <span><span class="comment-author">${escapeHtml(c.author)}</span></span>
          <span>${formatTime(c.created_at)}</span>
        </div>
        ${c.text ? `<div class="comment-text">${escapeHtml(c.text)}</div>` : ''}
        ${c.audio_base64 ? `<audio class="comment-audio" controls src="data:audio/webm;base64,${c.audio_base64}"></audio>` : ''}
      </div>
    `).join('');
  }

  function escapeHtml(s) {
    if (!s) return '';
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function formatTime(ts) {
    const d = new Date(ts);
    return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  // ============ 发送文字评论 ============
  async function sendText() {
    const text = document.getElementById('textInput').value.trim();
    if (!text) return;
    await postComment({ text });
    document.getElementById('textInput').value = '';
  }

  // ============ 录音留言 ============
  async function startVoice() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        stream.getTracks().forEach(t => t.stop());
        document.getElementById('voiceBtn').classList.remove('recording');
        document.getElementById('voiceLabel').textContent = '按住说';
        await postComment({ audio: audioBlob });
      };
      mediaRecorder.start();
      isRecording = true;
      document.getElementById('voiceBtn').classList.add('recording');
      document.getElementById('voiceLabel').textContent = '松开发送';
    } catch (err) {
      alert('无法访问麦克风：' + err.message);
    }
  }

  function stopVoice() {
    if (!isRecording) return;
    isRecording = false;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
  }

  // ============ 提交评论 ============
  async function postComment({ text, audio }) {
    const formData = new FormData();
    formData.append('memory_id', memoryId);
    formData.append('author', '家人');
    if (text) formData.append('text', text);
    if (audio) formData.append('audio', audio, 'comment.webm');

    try {
      const resp = await fetch('/api/comment', { method: 'POST', body: formData });
      const data = await resp.json();
      if (resp.ok && data.ok) {
        // 重新加载评论
        const memoryResp = await fetch(`/api/memory/${memoryId}`);
        const memoryData = await memoryResp.json();
        renderComments(memoryData.comments || []);
      } else {
        alert('发送失败：' + (data.error || '未知错误'));
      }
    } catch (err) {
      alert('网络错误：' + err.message);
    }
  }

  // 自动调整 textarea 高度
  document.getElementById('textInput').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  // Enter 发送（不换行）
  document.getElementById('textInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendText();
    }
  });

  // 启动
  loadMemory();
</script>


</body></html>
