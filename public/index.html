<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的记忆</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fdf6ee;
    color: #333;
    font-size: 18px;
    min-height: 100vh;
    padding: 20px;
    padding-bottom: 40px;
  }
  .container { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 28px; text-align: center; margin: 20px 0 30px; color: #5a3825; font-weight: 600; }
  h2 { font-size: 22px; text-align: center; margin: 20px 0; color: #5a3825; font-weight: 600; }

  /* 按钮通用样式 */
  .btn {
    display: block;
    width: 100%;
    min-height: 64px;
    font-size: 22px;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.1s, box-shadow 0.2s;
    margin: 12px 0;
    padding: 0 20px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #e76f51; color: white; box-shadow: 0 4px 12px rgba(231,111,81,0.3); }
  .btn-primary:hover { box-shadow: 0 6px 16px rgba(231,111,81,0.4); }
  .btn-secondary { background: #f4a261; color: white; box-shadow: 0 4px 12px rgba(244,162,97,0.3); }
  .btn-ghost { background: #fff; color: #5a3825; border: 2px solid #e76f51; }
  .btn-ghost:hover { background: #fef3ec; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* 隐藏的文件输入 */
  input[type="file"] { display: none; }

  /* 页面切换 */
  .page { display: none; }
  .page.active { display: block; animation: fadeIn 0.4s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* 预览图 */
  .preview-wrap {
    width: 100%;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    background: white;
    margin: 16px 0;
  }
  .preview-wrap img { width: 100%; display: block; }

  /* 录音按钮 */
  .record-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 160px;
    border-radius: 50%;
    background: #e76f51;
    color: white;
    font-size: 24px;
    font-weight: 700;
    border: none;
    box-shadow: 0 8px 24px rgba(231,111,81,0.4);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .record-btn:active, .record-btn.recording {
    background: #d62828;
    transform: scale(1.05);
    box-shadow: 0 12px 32px rgba(214,40,40,0.5);
  }
  .record-icon { font-size: 48px; margin-bottom: 8px; }
  .record-tip { text-align: center; margin: 16px 0; color: #888; font-size: 18px; }

  /* 识别文字 */
  .text-display {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin: 16px 0;
    font-size: 20px;
    line-height: 1.8;
    color: #444;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    min-height: 100px;
  }

  /* 风格选择 */
  .style-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 16px 0;
  }
  .style-btn {
    min-height: 90px;
    font-size: 20px;
    border: 3px solid transparent;
    border-radius: 16px;
    background: white;
    cursor: pointer;
    font-weight: 600;
    color: #5a3825;
    transition: all 0.2s;
    padding: 16px;
  }
  .style-btn.selected {
    border-color: #e76f51;
    background: #fef3ec;
    color: #e76f51;
    transform: scale(1.02);
  }
  .style-btn .emoji { font-size: 32px; display: block; margin-bottom: 4px; }

  /* 加载动画 */
  .loading-wrap {
    text-align: center;
    padding: 60px 20px;
  }
  .loader {
    width: 80px; height: 80px;
    border: 6px solid #f4a261;
    border-top: 6px solid #e76f51;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 22px; color: #5a3825; margin-bottom: 8px; }
  .loading-sub { font-size: 16px; color: #999; }

  /* 视频结果 */
  video {
    width: 100%;
    border-radius: 16px;
    background: black;
    margin: 16px 0;
  }

  /* 二维码 */
  .qr-wrap {
    text-align: center;
    background: white;
    border-radius: 16px;
    padding: 24px;
    margin: 16px 0;
  }
  .qr-wrap canvas { margin: 0 auto; display: block; }
  .qr-tip { font-size: 16px; color: #888; margin-top: 12px; }

  /* 图片 base64 隐藏 */
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

  /* 步骤指示器 */
  .steps { display: flex; justify-content: center; gap: 8px; margin: 12px 0 24px; }
  .step-dot { width: 12px; height: 12px; border-radius: 50%; background: #ddd; transition: all 0.3s; }
  .step-dot.active { background: #e76f51; transform: scale(1.3); }
  .step-dot.done { background: #f4a261; }
</style>
</head>
<body>
<div class="container">

  <!-- 页面 1: 首页 -->
  <div id="page-home" class="page active">
    <h1>📸 拍一拍，做个记忆视频</h1>
    <p style="text-align:center; color:#888; margin-bottom:30px;">拍张照片，说段话，生成一个会动的记忆</p>
    <label class="btn btn-primary" for="photoInput">📷 拍一张</label>
    <input type="file" id="photoInput" accept="image/*" capture="environment">
    <div style="text-align:center; margin-top: 40px;">
      <h2>看看别人的记忆</h2>
      <a class="btn btn-ghost" href="view.html?memory_id=demo">查看示例视频</a>
    </div>
  </div>

  <!-- 页面 2: 预览照片 -->
  <div id="page-photo" class="page">
    <h2>📷 看看拍得怎么样</h2>
    <div class="preview-wrap"><img id="photoPreview" alt="照片预览"></div>
    <button class="btn btn-ghost" onclick="goHome()">🔄 重新拍</button>
    <button class="btn btn-primary" onclick="goRecord()">✅ 很好，继续</button>
  </div>

  <!-- 页面 3: 语音讲述 -->
  <div id="page-record" class="page">
    <h2>🎤 按住说话</h2>
    <p class="record-tip">按住下面的按钮，讲讲这张照片的故事</p>
    <div class="preview-wrap"><img id="photoPreviewSmall" alt="照片" style="max-height:180px; object-fit:cover;"></div>
    <div style="text-align:center;">
      <button id="recordBtn" class="record-btn">
        <span class="record-icon">🎙️</span>
        <span id="recordText">按住说话</span>
      </button>
    </div>
    <p id="recordStatus" style="text-align:center; margin-top:16px; color:#e76f51; font-size:18px;"></p>
    <button id="skipToStyle" class="btn btn-ghost" style="display:none;" onclick="skipToStyle()">没有语音，直接选风格</button>
  </div>

  <!-- 页面 4: 显示识别文字 + 选风格 -->
  <div id="page-style" class="page">
    <h2>💬 你刚才说的是</h2>
    <div class="text-display" id="textDisplay">正在识别中…</div>
    <h2>🎨 选个风格</h2>
    <div class="style-grid">
      <button class="style-btn" data-style="文艺" onclick="selectStyle(this)">
        <span class="emoji">🌸</span>文艺
      </button>
      <button class="style-btn" data-style="喜庆" onclick="selectStyle(this)">
        <span class="emoji">🎉</span>喜庆
      </button>
      <button class="style-btn" data-style="美丽" onclick="selectStyle(this)">
        <span class="emoji">🌺</span>美丽
      </button>
      <button class="style-btn" data-style="怀旧" onclick="selectStyle(this)">
        <span class="emoji">📻</span>怀旧
      </button>
    </div>
    <button id="generateBtn" class="btn btn-primary" onclick="generateVideo()" disabled="">✨ 生成我的记忆视频</button>
  </div>

  <!-- 页面 5: 生成中 -->
  <div id="page-loading" class="page">
    <div class="loading-wrap">
      <div class="loader"></div>
      <div class="loading-text">正在制作你的记忆…</div>
      <div class="loading-sub" id="loadingSub">照片 + 语音 + 风格 = 独一无二的视频</div>
    </div>
  </div>

  <!-- 页面 6: 结果 -->
  <div id="page-result" class="page">
    <h2>🎉 你的记忆视频做好了</h2>
    <video id="resultVideo" controls=""></video>
    <a id="saveBtn" class="btn btn-secondary" download="">📥 保存到手机</a>

    <div class="qr-wrap">
      <h2 style="font-size:18px; margin: 0 0 12px;">📱 发给家人，扫这个码</h2>
      <canvas id="qrCanvas"></canvas>
      <p class="qr-tip">家人扫码就能看视频、留评论、说句话</p>
    </div>

    <button class="btn btn-ghost" onclick="goHome()">🔄 再拍一个</button>
  </div>

</div>

<script>
  // ============ 状态 ============
  const state = {
    photoBase64: null,
    audioBlob: null,
    recognizedText: '',
    selectedStyle: null,
    memoryId: null,
    videoUrl: null,
  };

  // ============ 页面切换 ============
  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
  }
  function goHome() {
    state.photoBase64 = null;
    state.audioBlob = null;
    state.recognizedText = '';
    state.selectedStyle = null;
    state.memoryId = null;
    state.videoUrl = null;
    document.getElementById('photoInput').value = '';
    showPage('page-home');
  }

  // ============ 拍照 ============
  const photoInput = document.getElementById('photoInput');
  photoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      state.photoBase64 = ev.target.result;
      document.getElementById('photoPreview').src = state.photoBase64;
      showPage('page-photo');
    };
    reader.readAsDataURL(file);
  });

  function goRecord() {
    document.getElementById('photoPreviewSmall').src = state.photoBase64;
    showPage('page-record');
  }

  function skipToStyle() {
    state.recognizedText = '(没有语音，只有照片)';
    recognizeSuccess();
  }

  // ============ 录音 ============
  const recordBtn = document.getElementById('recordBtn');
  const recordText = document.getElementById('recordText');
  const recordStatus = document.getElementById('recordStatus');
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;
  let recordingTimer = null;

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
      audioChunks = [];
      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        state.audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        stream.getTracks().forEach(t => t.stop());
        recordStatus.textContent = '⏳ 正在识别您说的话…';
        sendAudioToServer();
      };
      mediaRecorder.start();
      isRecording = true;
      recordBtn.classList.add('recording');
      recordText.textContent = '松开 结束';
      recordingTimer = setInterval(() => {
        // 自动最长 60 秒
      }, 1000);
    } catch (err) {
      recordStatus.textContent = '❌ 无法访问麦克风：' + err.message;
    }
  }

  function stopRecording() {
    if (!isRecording) return;
    isRecording = false;
    clearInterval(recordingTimer);
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    recordBtn.classList.remove('recording');
    recordText.textContent = '按住说话';
  }

  // 同时支持鼠标和触摸
  recordBtn.addEventListener('mousedown', startRecording);
  recordBtn.addEventListener('mouseup', stopRecording);
  recordBtn.addEventListener('mouseleave', () => { if (isRecording) stopRecording(); });
  recordBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
  recordBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });

  // ============ 发送音频识别 ============
  async function sendAudioToServer() {
    if (!state.audioBlob) return;
    try {
      const formData = new FormData();
      formData.append('audio', state.audioBlob, 'recording.webm');
      const resp = await fetch('/api/recognize', { method: 'POST', body: formData });
      const data = await resp.json();
      if (resp.ok && data.text) {
        state.recognizedText = data.text;
      } else {
        state.recognizedText = '(识别失败，可以继续选风格，或重新录音)';
      }
    } catch (err) {
      state.recognizedText = '(网络错误，可以继续选风格，或重新录音)';
    }
    recognizeSuccess();
  }

  function recognizeSuccess() {
    document.getElementById('textDisplay').textContent = state.recognizedText;
    document.getElementById('skipToStyle').style.display = 'none';
    showPage('page-style');
  }

  // ============ 选风格 ============
  function selectStyle(btn) {
    document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    state.selectedStyle = btn.dataset.style;
    document.getElementById('generateBtn').disabled = false;
  }

  // ============ 生成视频 ============
  async function generateVideo() {
    if (!state.photoBase64 || !state.selectedStyle) return;
    showPage('page-loading');
    document.getElementById('loadingSub').textContent = '正在制作您的专属记忆视频，大概需要 1~3 分钟…';

    try {
      // 去掉 data:image/xxx;base64, 前缀（后端也能处理两种，这里保持简洁）
      let imageData = state.photoBase64;
      // 保留完整 data URL 格式给后端
      const resp = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          image: imageData,
          text: state.recognizedText,
          style: state.selectedStyle,
        }),
      });
      const data = await resp.json();
      if (resp.ok) {
        state.memoryId = data.memory_id;
        state.videoUrl = data.video_url;
        showResult();
      } else {
        document.getElementById('loadingSub').textContent = '❌ ' + (data.error || '生成失败');
      }
    } catch (err) {
      document.getElementById('loadingSub').textContent = '❌ 网络错误：' + err.message;
    }
  }

  // ============ 展示结果 ============
  function showResult() {
    showPage('page-result');
    const video = document.getElementById('resultVideo');
    video.src = state.videoUrl;
    video.play().catch(() => {});

    const saveBtn = document.getElementById('saveBtn');
    saveBtn.href = state.videoUrl;

    // 生成二维码
    const viewUrl = `${window.location.origin}/view.html?memory_id=${state.memoryId}`;
    QRCode.toCanvas(document.getElementById('qrCanvas'), viewUrl, {
      width: 240, margin: 2, color: { dark: '#5a3825', light: '#ffffff' }
    }, (err) => {
      if (err) console.error('二维码生成失败:', err);
    });
  }
</script>


</body></html>
